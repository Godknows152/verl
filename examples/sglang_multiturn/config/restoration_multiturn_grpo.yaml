# Image Restoration Multi-turn GRPO Training Configuration
#
# Trains a Qwen3-VL model to perform iterative image restoration by selecting
# appropriate restoration tools based on observed degradation.
#
# Usage:
#   cd /home/LXJ/Python_Projects/verl
#   python3 -m verl.trainer.main_ppo \
#     --config-path="$(pwd)/examples/sglang_multiturn/config" \
#     --config-name='restoration_multiturn_grpo'

hydra:
  searchpath:
    - file://verl/trainer/config

defaults:
  - ppo_trainer
  - _self_

# ---------------------------------------------------------------------------
# Data
# ---------------------------------------------------------------------------
data:
  # Update these paths after running convert_restoration_dataset.py
  train_files:
    - data/restoration/train.parquet
  val_files:
    - data/restoration/test.parquet
  val_max_samples: 256
  train_batch_size: 64
  max_prompt_length: 2048
  max_response_length: 3072
  # Return raw multi-turn chat structure (required by the agent loop)
  return_raw_chat: true
  # IMPORTANT: Must be false for multi-turn with tool-generated images —
  # the agent loop injects new images dynamically during rollout.
  return_multi_modal_inputs: false

# ---------------------------------------------------------------------------
# Algorithm
# ---------------------------------------------------------------------------
algorithm:
  adv_estimator: grpo
  kl_ctrl:
    kl_coef: 0.12

# ---------------------------------------------------------------------------
# Actor / Rollout / Ref
# ---------------------------------------------------------------------------
actor_rollout_ref:
  model:
    # Update to your actual Qwen3-VL checkpoint path
    path: checkpoints/merged/Train4/Step102

  actor:
    optim:
      lr: 3.0e-5
    entropy_coeff: 0.01
    ppo_epochs: 1
    use_kl_loss: true
    kl_loss_coef: 0.12
    fsdp_config:
      # Use bf16 to match Flash Attention 2 requirements and reduce memory pressure
      model_dtype: bfloat16
      param_offload: true
      optimizer_offload: true
    ppo_mini_batch_size: 64
    ppo_micro_batch_size_per_gpu: 8

  rollout:
    name: sglang
    # Keep rollout dtype aligned with actor precision
    dtype: bfloat16
    temperature: 1.0
    disable_multimodal_special_token_generation: true
    # GRPO requires n > 1 to compute group-relative advantages
    n: 3
    # TP=1 gives each rollout shard a full model replica on one GPU and maximizes
    # rollout-side parallelism, but it also increases per-GPU memory pressure.
    tensor_model_parallel_size: 4
    # SGLang uses all 4 GPUs (0-3); restoration/IQA models still share residual VRAM,
    # with GPU 3 typically the tightest due to IQA placement.
    # (AgentLoopWorker does not request a dedicated GPU from Ray)
    gpu_memory_utilization: 0.1
    log_prob_micro_batch_size_per_gpu: 2

    agent:
      # Keep at 1 to avoid OOM — each worker loads multiple restoration models (~13 GB)
      num_workers: 1
      # No dedicated GPU requested from Ray; restoration/IQA models share GPU 3's remaining VRAM
      num_gpus_per_worker: 0.0
      default_agent_loop: tool_agent

    multi_turn:
      enable: true
      max_user_turns: 7
      max_assistant_turns: 6
      # Round-barrier synchronization: all trajectories wait at each generation
      # round boundary until every trajectory has finished its tool call, then
      # submit their next generation request simultaneously.  This lets SGLang
      # batch requests efficiently and eliminates the cascading stagger effect
      # that causes poor GPU utilization in later rounds.
      # Set to 0 to disable, or a positive integer to enable (auto = batch size).
      # 4-GPU: train_batch_size=8 × n=3 = 24 trajectories per batch
      round_barrier_size: 0
      # Parse tool calls in hermes format: <tool_call>{...}</tool_call>
      format: hermes
      tool_config_path: examples/sglang_multiturn/config/tool_config/restoration_tool_config.yaml

  ref:
    log_prob_micro_batch_size_per_gpu: 2

# ---------------------------------------------------------------------------
# Trainer
# ---------------------------------------------------------------------------
trainer:
  logger:
    - console
    - swanlab
  project_name: verl
  experiment_name: qwen3vl_restoration_grpo
  # Resume from a specific checkpoint and keep subsequent saves in the same run directory.
  resume_model: disable
  # resume_mode: resume_path
  # resume_from_path: checkpoints/merged/Train4/Step102
  default_local_dir: checkpoints/verl/multiturn_grpo_0508
  log_val_generations: 5
  # Use all 4 GPUs for rollout (GPUs 0-3); restoration/IQA models share remaining VRAM,
  # with GPU 3 usually the first pressure point because IQA is pinned there.
  # (num_gpus_per_worker: 0.0 — AgentLoopWorker accesses GPU 3 directly without Ray GPU allocation)
  n_gpus_per_node: 4
  nnodes: 1
  save_freq: 10
  test_freq: 20
  total_epochs: 3
  max_actor_ckpt_to_keep: 10
  val_before_train: false
  # Pass LD_LIBRARY_PATH and LD_PRELOAD to Ray workers so SGLang subprocesses can find PyTorch's CUDA 12.8 runtime
  # LD_PRELOAD forces the correct libcudart.so.12 (with cudaGetDriverEntryPointByVersion) to load first
  ray_kwargs:
    ray_init:
      runtime_env:
        env_vars:
          LD_LIBRARY_PATH: "/home/LXJ/anaconda3/envs/verl/lib/python3.12/site-packages/nvidia/cuda_runtime/lib:/home/LXJ/anaconda3/envs/verl/lib/python3.12/site-packages/torch/lib:/home/LXJ/anaconda3/envs/verl/lib/python3.12/site-packages/nvidia/cudnn/lib"
          LD_PRELOAD: "/home/LXJ/anaconda3/envs/verl/lib/python3.12/site-packages/nvidia/cuda_runtime/lib/libcudart.so.12"
          PYTHONUNBUFFERED: "1"
          XFORMERS_IGNORE_FLASH_VERSION_CHECK: "1"
          SGLANG_DISABLE_CUDNN_CHECK: "1"
          VERL_LOGGING_LEVEL: "WARN"
          VERL_LOG_DIR: "/home/LXJ/Python_Projects/verl/log"
