# Image Restoration Multi-turn GRPO Training Configuration — 3-GPU variant
#
# 基于 restoration_multiturn_grpo.yaml，改动点：
#   - actor_rollout_ref.model.path: 指向 step120 合并后的 HF 模型
#   - trainer.resume_mode: disable（从合并后的 HF 模型全新开始，不续训旧 VERL ckpt）
#   - trainer.default_local_dir: 新 checkpoint 目录，避免与旧 4 卡 ckpt 混用
#   - trainer.n_gpus_per_node: 4 → 3
#   - trainer.total_epochs: 3
#   - rollout.multi_turn.tool_config_path: 指向 3-GPU 专用 tool config
#   - tool config 中 iqa_device: cuda:3 → cuda:2
#   - tool config 中 auto_unload: false（显存充足，无需每次采样后自卸载）
#
# Usage:
#   cd /home/LXJ/Python_Projects/verl
#   bash examples/sglang_multiturn/run_qwen3_vl_restoration_3gpu.sh

hydra:
  searchpath:
    - file://verl/trainer/config

defaults:
  - ppo_trainer
  - _self_

# ---------------------------------------------------------------------------
# Data
# ---------------------------------------------------------------------------
data:
  train_files:
    - data/restoration/train.parquet
  val_files:
    - data/restoration/test.parquet
  val_max_samples: 8
  train_batch_size: 6
  max_prompt_length: 2048
  max_response_length: 3072
  return_raw_chat: true
  return_multi_modal_inputs: false

# ---------------------------------------------------------------------------
# Algorithm
# ---------------------------------------------------------------------------
algorithm:
  adv_estimator: grpo
  kl_ctrl:
    kl_coef: 0.12

# ---------------------------------------------------------------------------
# Actor / Rollout / Ref
# ---------------------------------------------------------------------------
actor_rollout_ref:
  model:
    path: /home/LXJ/Python_Projects/LLaMA_Factory/LlamaFactory/saves/sft_0430merge

  actor:
    optim:
      lr: 3.0e-5
    entropy_coeff: 0.01
    ppo_epochs: 2
    use_kl_loss: true
    kl_loss_coef: 0.12
    fsdp_config:
      model_dtype: bfloat16
      param_offload: true
      optimizer_offload: true
    ppo_mini_batch_size: 6
    ppo_micro_batch_size_per_gpu: 2

  rollout:
    name: sglang
    dtype: bfloat16
    temperature: 1.0
    disable_multimodal_special_token_generation: true
    # GRPO requires n > 1 to compute group-relative advantages
    n: 4
    tensor_model_parallel_size: 1
    # SGLang uses 3 GPUs (0-2); restoration/IQA models share residual VRAM,
    # with GPU 2 typically the tightest due to IQA placement.
    # (AgentLoopWorker does not request a dedicated GPU from Ray)
    gpu_memory_utilization: 0.575
    log_prob_micro_batch_size_per_gpu: 4

    agent:
      num_workers: 1
      # No dedicated GPU requested from Ray; restoration/IQA models share GPU 2's remaining VRAM
      num_gpus_per_worker: 0.0
      default_agent_loop: tool_agent

    multi_turn:
      enable: true
      max_user_turns: 6
      max_assistant_turns: 7
      # Round-barrier synchronization: all trajectories wait at each generation
      # round boundary until every trajectory has finished its tool call, then
      # submit their next generation request simultaneously.  This lets SGLang
      # batch requests efficiently and eliminates the cascading stagger effect
      # that causes poor GPU utilization in later rounds.
      # Set to 0 to disable, or a positive integer to enable (auto = batch size).
      # 3-GPU: train_batch_size=6 × n=4 = 24 trajectories per batch
      round_barrier_size: 24
      format: hermes
      # 使用 3-GPU 专用 tool config（iqa_device=cuda:2）
      tool_config_path: examples/sglang_multiturn/config/tool_config/restoration_tool_config_3gpu.yaml

  ref:
    log_prob_micro_batch_size_per_gpu: 2

# ---------------------------------------------------------------------------
# Trainer
# ---------------------------------------------------------------------------
trainer:
  logger:
    - console
    - swanlab
  project_name: verl
  experiment_name: qwen3vl_restoration_grpo_3gpu
  resume_mode: disable
# resume_from_path: checkpoints/verl/multiturn_grpo_3gpu/05110008/global_step_45
  default_local_dir: checkpoints/verl/multiturn_grpo_3gpu
  log_val_generations: 5
  # 使用 3 张 GPU (0-2)；IQA 固定在 GPU 2，GPU 2 是显存最紧张的卡
  # (num_gpus_per_worker: 0.0 — AgentLoopWorker 直接访问 GPU 2，不通过 Ray 申请)
  n_gpus_per_node: 3
  nnodes: 1
  save_freq: 3
  test_freq: 10
  total_epochs: 3
  max_actor_ckpt_to_keep: 10
  val_before_train: false
  ray_kwargs:
    ray_init:
      runtime_env:
        env_vars:
          LD_LIBRARY_PATH: "/home/LXJ/anaconda3/envs/verl/lib/python3.12/site-packages/nvidia/cuda_runtime/lib:/home/LXJ/anaconda3/envs/verl/lib/python3.12/site-packages/torch/lib:/home/LXJ/anaconda3/envs/verl/lib/python3.12/site-packages/nvidia/cudnn/lib"
          LD_PRELOAD: "/home/LXJ/anaconda3/envs/verl/lib/python3.12/site-packages/nvidia/cuda_runtime/lib/libcudart.so.12"
          PYTHONUNBUFFERED: "1"
          XFORMERS_IGNORE_FLASH_VERSION_CHECK: "1"
          SGLANG_DISABLE_CUDNN_CHECK: "1"
          VERL_LOGGING_LEVEL: "WARN"
          VERL_LOG_DIR: "/home/LXJ/Python_Projects/verl/log"
