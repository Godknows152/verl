# Image Restoration Tool Configuration for verl multi-turn rollout
#
# This file configures the RestorationTool that wraps the restoration models
# located in restoration_tools/agent_tools/.
#
# GPU memory management strategy:
#   To avoid conflicts with SGLang's memory_saver (which can cause
#   resume_memory_occupation timeouts), dynamic model loading is used:
#   - preload=false: models are loaded on demand instead of at startup
#   - auto_unload=true: models are unloaded after each use to free GPU memory
#   This allows SGLang to reclaim GPU memory when syncing weights.
#
# Usage:
#   actor_rollout_ref:
#     rollout:
#       multi_turn:
#         tool_config_path: examples/sglang_multiturn/config/tool_config/restoration_tool_config.yaml

tools:
  - class_name: "verl.tools.restoration_tool.RestorationTool"
    config:
      type: native
      # Base device fallback. Actual restoration models are distributed across model_devices.
      device: cuda:0
      # Distribute restoration models across the first 3 GPUs.
      # IQA stays pinned to gpu3, but rollout may also use gpu3 when TP=1.
      model_devices: [cuda:0, cuda:1, cuda:2]
      # Directory for intermediate output images
      output_dir: /tmp/verl_restoration
      # Use phase-managed loading: preload all models at sampling start,
      # and unload all models once after sampling finishes.
      preload: false
      auto_unload: false
      # IQA reward computation settings: pin IQA to gpu3.
      # This means gpu3 is usually the first shared-memory bottleneck during rollout.
      use_iqa: true
      iqa_device: cuda:3
      # Compute frozen local dataset stats first:
      # python scripts/compute_iqa_stats.py --parquet data/restoration/train.parquet
      normalize_iqa_scores: true
      iqa_stats_path: data/restoration/iqa_stats.json
      # Optional data-driven metric weights generated from local training data.
      # Without this file, the tool falls back to the legacy hard-coded map.
      iqa_weight_map_path: data/restoration/iqa_weight_map.json
      # alpha * marginal_improvement + (1-alpha) * identity_improvement
      # All thresholds below are interpreted in normalized IQA space.
      alpha: 0.9
      reward_scale: 4.0
      # Penalize repeating the same tool when weighted z-score gains are already small.
      repeat_action_penalty: 0.75
      repeat_low_gain_penalty: 2.0
      # ~0.1 means the weighted marginal gain is already close to a plateau.
      repeat_low_gain_threshold: 0.12
      # Reward stopping once normalized quality is good enough or recent rewards plateau.
      stop_min_step: 4
      # ~0.6 means the weighted improvement over the original image is materially positive.
      stop_iqa_delta_threshold: 0.6
      stop_success_reward: 1.8
      stop_partial_reward: 0.6
      stop_early_penalty: -1.2
      stop_continue_penalty: -0.4
      stop_recent_reward_window: 2
      stop_recent_reward_threshold: 0.2
    tool_schema:
      type: "function"
      function:
        name: "restore_image"
        description: |
          Apply an image restoration operation to remove degradation.
          Available restoration actions:
          - real_esrgan: Super-resolution, deblurring, denoising, compression artifact removal
          - scunet: High-quality image denoising
          - retinexformer_fivek: Low-light image enhancement
          - hvicidnet: Low-light and exposure correction
          - lightdiff: Low-light enhancement using diffusion model
          - turbo_rain: Fast deraining
          - s2former: Rain streak removal
          - idt: Deraining and raindrop removal
          - ridcp: Image dehazing
          - kanet: Image dehazing
          - turbo_snow: Image desnowing
          - snowmaster: Advanced desnowing
          - stop: Stop the restoration process (use when image is sufficiently restored)

          Choose the most appropriate action based on the observed degradation type.
        parameters:
          type: "object"
          properties:
            action:
              type: "string"
              description: |
                The restoration action to apply. Must be one of:
                real_esrgan, scunet, retinexformer_fivek, hvicidnet, lightdiff,
                turbo_rain, s2former, idt, ridcp, kanet, turbo_snow, snowmaster, stop
              enum:
                - real_esrgan
                - scunet
                - retinexformer_fivek
                - hvicidnet
                - lightdiff
                - turbo_rain
                - s2former
                - idt
                - ridcp
                - kanet
                - turbo_snow
                - snowmaster
                - stop
          required:
            - action
